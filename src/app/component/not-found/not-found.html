<div class="container-fluid d-flex align-items-center justify-content-center min-vh-100 bg-transparent">
  <div class="row justify-content-center w-100">
    <div class="col-12 col-md-8 col-lg-6">
      <div class="card shadow-lg border-0 bg-opacity-90 bg-body">
        <div class="card-body text-center p-5">
          <div class="mb-4">
            <fa-icon [icon]="icons.warning" class="text-warning display-1"></fa-icon>
          </div>
          
          <h1 class="display-1 fw-bold text-primary mb-3">404</h1>
          <h2 class="h3 mb-4 text-secondary">{{'404.TITLE' | translate}}</h2>
          <p class="lead text-muted mb-5">{{'404.DESCRIPTION' | translate}}</p>
          
          <div class="d-grid gap-2 d-md-flex justify-content-md-center">
            <a class="btn btn-primary btn-lg px-4" routerLink="/">
              <fa-icon [icon]="icons.back" class="me-2"></fa-icon>
              {{'404.RETURN' | translate}}
            </a>
            <a class="btn btn-outline-secondary btn-lg px-4" routerLink="/contact">
              <fa-icon [icon]="icons.email" class="me-2"></fa-icon>
              {{'NAVBAR.CONTACT' | translate}}
            </a>
          </div>
        </div>
      </div>
      
      <div class="text-center mt-4">
        <div class="card border-0 shadow-sm bg-opacity-90 bg-body">
          <div class="card-body py-2">
            <p class="mb-0">
              <fa-icon [icon]="icons.tip" class="me-2 text-warning"></fa-icon>
              <small><strong>{{'404.SUGGESTION' | translate}}</strong></small>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
